name: Ritmo
options:
  bundleIdPrefix: cl.matiascastro
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  Ritmo:
    type: application
    platform: iOS
    sources: [Ritmo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cl.matiascastro.ritmo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Ritmo
